name: MacOS Build Steps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_macos:
    name: macOS Build
    runs-on: macos-14
    permissions:
      contents: read
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 9
      CCACHE_MAXSIZE: 200M
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install Packages
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: brew install ccache ninja

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/deps
          key: macos-11-universal-deps-${{ hashFiles('.github/workflows/scripts/macos/build-dependencies.sh') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash .github/workflows/scripts/macos/build-dependencies.sh

      - name: Cache MoltenVK
        id: cache-moltenvk
        uses: actions/cache@v4
        with:
          path: ~/moltenvk
          key: macos-11-universal-moltenvk-v2-${{ hashFiles('.github/workflows/macos_build.yml', 'Externals/MoltenVK/CMakeLists.txt', 'Externals/MoltenVK/patches/*.patch') }}

      - name: Build MoltenVK
        if: steps.cache-moltenvk.outputs.cache-hit != 'true'
        run: |
          MVK_VER="$(sed -nr 's/^.*set\(MOLTENVK_VERSION "([^"]+)".*$/\1/p' Externals/MoltenVK/CMakeLists.txt)"
          if [ -z "$MVK_VER" ]; then
            echo "::error::Failed to parse MoltenVK version from CMakeLists"
            exit 1
          fi
          git clone --depth 1 --branch "$MVK_VER" https://github.com/KhronosGroup/MoltenVK.git mvk-build
          pushd mvk-build
          git apply ../Externals/MoltenVK/patches/*.patch
          ./fetchDependencies --macos
          make macos ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          ls -l Package/Release/MoltenVK/dynamic/*
          chmod 755 Package/Release/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
          mkdir -p "$HOME/moltenvk/lib/"
          mv Package/Release/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib "$HOME/moltenvk/lib/"
          popd
          rm -rf mvk-build

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: macos-11-universal-ccache-v2-${{ github.run_id }}
          restore-keys: macos-11-universal-ccache-v2-

      - name: Configure x86_64
        run: bash .github/workflows/scripts/macos/configure.sh x86_64 build

      - name: Configure arm64
        run: bash .github/workflows/scripts/macos/configure.sh arm64 build-arm

      - name: Build x86_64
        run: bash .github/workflows/scripts/macos/build.sh build

      - name: Build arm64
        run: bash .github/workflows/scripts/macos/build.sh build-arm

      - name: Run macOS unit tests
        run: bash .github/workflows/scripts/macos/test.sh build

      - name: Package and validate universal app
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/workflows/scripts/macos/package.sh build build-arm

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ github.sha }}
          path: "*.tar.xz"
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish macOS release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build_macos
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-package-${{ github.sha }}
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$(find release-assets -type f -name '*.tar.xz' -print -quit)"
          if [ -z "$asset" ]; then
            echo "No macOS archive was found in the build artifact"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
